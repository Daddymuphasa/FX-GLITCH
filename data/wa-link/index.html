<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan WhatsApp</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding: 24px; }
    img { width: min(360px, 90vw); background: #fff; padding: 12px; border-radius: 12px; }
  </style>
</head>
<body>
  <p>WhatsApp → Settings → Linked devices → Link a device</p>
  <p><img id="qr" src="/qr.png" alt="WhatsApp QR" /></p>
  <script>setInterval(function () { document.getElementById("qr").src = "/qr.png?t=" + Date.now(); }, 2000);</script>
</body>
</html>
