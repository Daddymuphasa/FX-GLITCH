services:
  desk:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FXGLITCH_VPS: "1"
      FXGLITCH_HOST: "0.0.0.0"
      FXGLITCH_PORT: "8765"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "8765:8765"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - desk

volumes:
  caddy_data:
  caddy_config:
